<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 1024px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .squircle {
      width: 960px;
      height: 960px;
      border-radius: 215px;
      background: linear-gradient(150deg, #1e40af 0%, #1d4ed8 50%, #0f172a 100%);
      box-shadow: 
        inset 0 4px 12px rgba(255, 255, 255, 0.4),
        inset 0 -8px 24px rgba(0, 0, 0, 0.5),
        0 32px 64px rgba(15, 23, 42, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 8px solid rgba(255, 255, 255, 0.15);
    }
    /* Subtle geometric grid line accents in background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(255,255,255,0.12) 0%, transparent 60%),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .emblem-wrapper {
      width: 480px;
      height: 480px;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.45));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      margin-top: 24px;
      font-size: 88px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.14em;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      line-height: 1;
    }
    .brand-sub {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 800;
      color: #93c5fd;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="squircle">
    <div class="bg-grid"></div>
    <div class="content">
      <div class="emblem-wrapper">
        <svg viewBox="0 0 186 123" width="460" height="305">
          <!-- Left arrow: dark navy -->
          <polygon points="0,48 28,48 28,26 69,61.5 28,97 28,75 0,75" fill="#0A2540" stroke="#38BDF8" stroke-width="2"/>
          <!-- Top arrow: vibrant royal blue -->
          <polygon points="81,0 105,0 105,20 126,20 93,57 60,20 81,20" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
          <!-- Right arrow: vibrant royal blue -->
          <polygon points="186,48 158,48 158,26 117,61.5 158,97 158,75 186,75" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
          <!-- Bottom arrow: vibrant royal blue -->
          <polygon points="81,123 105,123 105,103 126,103 93,66 60,103 81,103" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
      </div>
      <h1 class="brand-title">SSE</h1>
      <p class="brand-sub">SADIK SONS ENTERPRISES</p>
    </div>
  </div>
</body>
</html>
